<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stránka nenalezena – Podlahářství Dragoun</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#241a14">
  <!-- Absolutní cesty: stránka se zobrazuje na libovolné neexistující adrese -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="navbar navbar--simple">
    <div class="container navbar__inner">
      <a class="navbar__logo" href="/" aria-label="Podlahářství Dragoun – úvodní stránka">
        <img src="/Obrazky/Logo/logo-dragoun-bile.svg" alt="Podlahářství Dragoun" width="542" height="92">
      </a>
      <a class="btn" href="/#kontakt">Poptat podlahu</a>

  <main class="error-page">
    <div class="container error-page__inner">
      <span class="icon error-page__icon" aria-hidden="true"><i class="fa-regular fa-face-frown"></i></span>
      <p class="error-page__code">404</p>
      <h1 class="error-page__title">Tuto stránku jsme nenašli</h1>
      <p class="error-page__text">Odkaz je možná neplatný nebo stránka už neexistuje. Pokračujte prosím na úvod webu.</p>
      <a class="btn btn--lg" href="/">Zpět na úvod</a>
    </div>
  </main>

</html>
